<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Interview — Session</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="page-interview">

    <div class="bg-grid"></div>

    <main class="shell shell-wide">

        <header class="topbar">

            <div class="brand small">
                <div class="brand-mark">
                    <i class="fa-solid fa-microphone-lines"></i>
                </div>
                <strong>AI Interview Tutor</strong>
            </div>

            <div class="session-meta" data-testid="session-meta">
                <span id="metaRole" class="chip"><i class="fa-solid fa-briefcase"></i> —</span>
                <span id="metaExperience" class="chip"><i class="fa-solid fa-user-clock"></i> —</span>
                <span id="metaDifficulty" class="chip"><i class="fa-solid fa-gauge-high"></i> —</span>
            </div>

        </header>

        <section class="progress-bar" aria-hidden="true">
            <div class="progress-track">
                <div id="progressFill" class="progress-fill" style="width: 0%"></div>
            </div>
            <span id="progressLabel" class="progress-label" data-testid="progress-label">Question 1</span>
        </section>

        <div class="interview-grid">

            <section class="card question-card">

                <div class="card-head row">
                    <div>
                        <span class="eyebrow">Question <span id="questionNumber" data-testid="question-number">1</span></span>
                        <h2 class="q-heading">Your question</h2>
                    </div>
                    <div class="timer" data-testid="question-timer">
                        <i class="fa-regular fa-clock"></i>
                        <span id="timer">00:00</span>
                    </div>
                </div>

                <div id="questionBox" class="question-box" data-testid="question-box">
                    Loading question...
                </div>

                <div class="field">
                    <div class="label-row">
                        <label for="answer">Your answer</label>
                        <button
                            type="button"
                            id="voiceBtn"
                            class="btn btn-ghost small"
                            data-testid="voice-btn"
                            title="Dictate your answer"
                        >
                            <i class="fa-solid fa-microphone"></i>
                            <span id="voiceLabel">Speak</span>
                        </button>
                    </div>
                    <textarea
                        id="answer"
                        rows="8"
                        placeholder="Type or speak your answer. Aim for clarity and specifics..."
                        data-testid="answer-textarea"
                    ></textarea>
                    <div class="answer-meta">
                        <span id="wordCount" data-testid="word-count">0 words</span>
                        <span id="voiceStatus" class="voice-status"></span>
                    </div>
                </div>

                <div id="feedbackBox" class="feedback-box" data-testid="feedback-box" hidden>
                    <div class="feedback-head">
                        <i class="fa-solid fa-comment-dots"></i>
                        <strong>Feedback on your last answer</strong>
                        <span id="feedbackScore" class="score-pill" data-testid="feedback-score">—</span>
                    </div>
                    <p id="feedbackText" data-testid="feedback-text"></p>
                </div>

                <div class="actions">
                    <button
                        type="button"
                        id="nextBtn"
                        class="btn btn-primary"
                        data-testid="next-btn"
                    >
                        <span class="btn-label">Next Question</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    <button
                        type="button"
                        id="finishBtn"
                        class="btn btn-secondary"
                        data-testid="finish-btn"
                    >
                        <i class="fa-solid fa-flag-checkered"></i>
                        <span class="btn-label">Finish &amp; See Report</span>
                    </button>
                </div>

            </section>


            </aside>

        </div>

    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/interview.js"></script>
</body>
</html>
